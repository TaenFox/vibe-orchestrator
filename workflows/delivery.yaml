id: delivery
title: Доставка
initial_status: todo
stages:
  - {id: todo, title: К выполнению, kind: human, next: selected_for_session}
  - {id: selected_for_session, title: Выбрано на сессию, kind: queue, pull_to: system_analysis}
  - id: system_analysis
    title: Системный анализ
    kind: agent
    wip: 3
    prompt: delivery/system_analysis.md
    model: gpt-5.4
    reasoning_effort: medium
    outcomes: {completed: ready_for_development}
  - {id: ready_for_development, title: Готово к разработке, kind: queue, pull_to: development}
  - id: development
    title: Разработка
    kind: agent
    wip: 3
    prompt: delivery/development.md
    model: gpt-5.4
    reasoning_effort: medium
    outcomes: {completed: ready_for_review}
  - {id: ready_for_review, title: Готово к ревью, kind: queue, pull_to: review}
  - id: review
    title: Ревью
    kind: agent
    wip: 2
    prompt: delivery/review.md
    model: gpt-5.4
    reasoning_effort: low
    outcomes: {completed: ready_for_acceptance, needs_rework: review}
  - {id: ready_for_acceptance, title: Готово к приемке, kind: queue, pull_to: acceptance}
  - id: acceptance
    title: Приемка
    kind: agent
    wip: 2
    prompt: delivery/acceptance.md
    model: gpt-5.4
    reasoning_effort: low
    outcomes: {completed: ready_for_release, needs_rework: acceptance}
  - {id: ready_for_release, title: Готово к релизу, kind: human, next: release}
  - {id: release, title: Релиз, kind: human, next: done}
  - {id: done, title: Готово, kind: done}
