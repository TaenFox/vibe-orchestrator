id: process_management
title: Управление процессом
initial_status: todo
stages:
  - {id: todo, title: К выполнению, kind: human, next: waiting}
  - {id: waiting, title: Ожидание, kind: queue, pull_to: in_progress}
  - id: in_progress
    title: В работе
    kind: agent
    wip: 2
    prompt: process_management/work.md
    model: gpt-5.6-luna
    reasoning_effort: medium
    outcomes: {completed: ready_for_auto_acceptance, needs_human_decision: in_progress}
  - {id: ready_for_auto_acceptance, title: Готово к авто-приемке, kind: queue, pull_to: auto_acceptance}
  - id: auto_acceptance
    title: Авто-приемка
    kind: agent
    wip: 2
    prompt: process_management/auto_acceptance.md
    model: gpt-5.6-luna
    reasoning_effort: low
    outcomes: {completed: human_acceptance, needs_human_decision: auto_acceptance}
  - {id: human_acceptance, title: Приемка человеком, kind: human, next: done}
  - {id: done, title: Готово, kind: done}
