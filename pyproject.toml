[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-orchestrator"
version = "0.1.0"
description = "Локальная pull-оркестрация для Codex CLI-агентов"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "Starlette>=0.37,<1", "Uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vibe = "vibe_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.vibe.environment]
interpreter = ".venv/bin/python"
setup = ".venv/bin/python -m pip install -e '.[dev]'"
check = ".venv/bin/python -m pytest --collect-only -q"
