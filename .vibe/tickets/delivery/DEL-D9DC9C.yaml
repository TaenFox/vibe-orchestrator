description: 'Автоматически создано из DEL-1340F8 на стадии Ревью.


  Summary:

  Нужна доработка обработки старта/ошибок run history: сейчас есть незакрытый failure-path
  и нарушена projection-семантика `last_outcome`.


  Details:

  1. Блокирующая ошибка в failure path: в [`src/vibe_orchestrator/orchestrator.py`](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/orchestrator.py:76)
  `metadata = {..., **self._prompt_metadata(stage)}` вычисляется до `try`. Если `prompt_spec`/чтение
  prompt-файла падает после записи `started` (например, prompt недоступен в момент
  `_execute`), исключение выходит мимо обработчика, `failed` не пишется в `run_history`,
  `active_run` не очищается, тикет зависает. Это противоречит AC про отражение failure
  path в истории. Локально воспроизвел одноразовым скриптом: `FileNotFoundError` оставляет
  `active_run=run-broken`, а в `run_history` остается только `started`.


  2. Нарушена projection-семантика `last_outcome`: в [`src/vibe_orchestrator/orchestrator.py`](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/orchestrator.py:59)
  при старте нового запуска код делает `ticket.last_outcome = None`. Для append-only
  истории это неверно: событие `started` не является новым terminal outcome, значит
  projection последнего завершенного запуска должна сохраняться до `completed`/`failed`.
  Сейчас повторный запуск стирает последнее outcome еще до результата; при сбое из
  п.1 тикет остается и без актуального outcome, и без нового failure event. Тестов
  на это нет.


  Проверки: `pytest -q tests/test_store.py tests/test_orchestrator.py tests/test_scheduler.py
  tests/test_codex.py` — 23 passed. Но существующие тесты покрывают только happy path
  и исключение внутри `runner.run`; сценарий сбоя до входа в `try` не покрыт.'
