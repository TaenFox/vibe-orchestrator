title: 'Rework for DEL-94E699: Document run traceability contract'
status: done
priority: 130
description: 'Автоматически создано из DEL-94E699 на стадии Ревью.


  Summary:

  Traceability contract is not durable yet: `run_history` metadata for `completed`/`failed`
  is recomputed at finish time instead of being bound to the metadata captured when
  the run started.


  Details:

  Blocking issue: the implementation can write inconsistent audit metadata for a single
  `run_id`. In [src/vibe_orchestrator/orchestrator.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/orchestrator.py:53)
  the `started` event records `model`, `reasoning_effort`, `prompt_path`, and `prompt_version`,
  but in [src/vibe_orchestrator/orchestrator.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/orchestrator.py:79)
  and [src/vibe_orchestrator/orchestrator.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/orchestrator.py:109)
  the same fields are recomputed again for `failed` and `completed`. If `workflows/*.yaml`
  or `prompts/*` change while a run is in flight, the final `run_history` entries
  can no longer match the actual execution profile and prompt identity that were used
  to create `.vibe/runs/<run_id>/run.json`. That directly conflicts with the documented
  contract in [README.md](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/README.md:149)
  and [ARCHITECTURE.md](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/ARCHITECTURE.md:45),
  which say a single `run_id` is the source of truth for audit and that prompt/execution
  metadata identify the concrete run.


  Required rework: persist immutable run metadata once at start and reuse exactly
  that snapshot for `completed`/`failed` events, or derive those fields from `run.json`
  instead of live workflow/prompt files. Add a regression test covering a run where
  prompt/workflow metadata changes between `started` and `completed`/`failed` and
  assert `run_history` remains consistent for the same `run_id`.


  Evidence: targeted tests currently pass (`pytest -q tests/test_codex.py tests/test_orchestrator.py
  tests/test_store.py tests/test_scheduler.py`), but there is no test for mid-run
  metadata drift.'
