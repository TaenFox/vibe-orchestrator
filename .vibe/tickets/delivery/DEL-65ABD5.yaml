description: "Автоматически создано из DEL-1F285E на стадии Ревью.\n\nSummary:\nНужна\
  \ доработка: повторное успешное прохождение Discovery `technical_analysis` создает\
  \ дубли связанных Delivery-тикетов. Текущая реализация покрывает базовый happy path,\
  \ но не защищает основной повторный цикл Correction → повторный анализ.\n\nDetails:\n\
  1. Блокирующий дефект: дублирование Delivery-тикетов при повторном `technical_analysis`\
  \ после Correction. В [src/vibe_orchestrator/orchestrator.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/orchestrator.py:157)\
  \ каждый `completed` на стадии `technical_analysis` безусловно вызывает `_create_delivery_children`,\
  \ а в [src/vibe_orchestrator/orchestrator.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/orchestrator.py:178)\
  \ новые `story/task/bug` всегда создаются через `store.create(...)` без какой-либо\
  \ дедупликации, идемпотентности или обновления уже существующих дочерних тикетов.\
  \ Это ломает ключевой сценарий из тикета: после `needs_correction` родительская\
  \ Idea должна повторно проходить тот же этап, но повторный успешный анализ создаст\
  \ второй комплект Delivery-тикетов для того же parent. Последствия: дубли работ,\
  \ неверная приоритизация, лишние WIP-exempt/обычные задачи и некорректный барьер\
  \ `implementation`, который потом будет ждать завершения всех дублей. \n\n2. Пробел\
  \ в тестах: есть только happy-path тест создания детей один раз ([tests/test_orchestrator.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/tests/test_orchestrator.py:409)),\
  \ но нет теста на повторный запуск `technical_analysis` для той же Discovery-идеи\
  \ и проверки отсутствия дублей. Без такого теста основной новый цикл Correction\
  \ → retry не защищен от регрессий.\n\nПроверка: `pytest -q tests/test_scheduler.py\
  \ tests/test_store.py tests/test_codex.py tests/test_orchestrator.py` — все 33 теста\
  \ проходят, но они не покрывают описанный сценарий повторного анализа."
