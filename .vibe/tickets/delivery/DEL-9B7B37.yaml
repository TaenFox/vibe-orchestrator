title: 'Rework for DEL-1F285E: Реализовать корректирующие тикеты и связь Discovery
  → Delivery'
status: done
priority: 100
description: 'Автоматически создано из DEL-1F285E на стадии Приемка.


  Summary:

  Не пройдена приемка: механика Discovery → Delivery реализована частично. Rework/Correction
  и WIP-exempt работают, но отсутствует поддержка обязательности связанных Delivery-тикетов,
  из-за чего стадия Discovery `implementation` ждет завершения всех дочерних Delivery-тикетов
  без различия mandatory/optional.


  Details:

  Ключевое расхождение с тикетом: Discovery Idea должна ждать завершения обязательных
  связанных Delivery-тикетов, но реализация не умеет помечать тикеты как обязательные
  и блокирует переход по любому дочернему Delivery-тикету.


  Доказательства:

  - В prompt для technical analysis нет поля обязательности: [prompts/discovery/technical_analysis.md](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/prompts/discovery/technical_analysis.md:9)
  описывает только `type`, `title`, `description`, `priority`.

  - Парсер/создание дочерних тикетов игнорирует любую семантику mandatory: [_create_delivery_children
  in orchestrator.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/orchestrator.py:178).

  - Барьер `implementation` смотрит на все связанные Delivery-тикеты без фильтрации:
  [_reconcile_discovery_implementation in orchestrator.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/orchestrator.py:251).

  - Документация тоже закрепляет поведение «ждет все связанные тикеты», а не только
  обязательные: [README.md](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/README.md:21),
  [ARCHITECTURE.md](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/ARCHITECTURE.md:73).


  Точечная проверка:

  - `pytest -q tests/test_orchestrator.py tests/test_scheduler.py tests/test_store.py
  tests/test_config.py` -> `28 passed`.

  - Дополнительная проверка через `python - <<''PY'' ...` показала, что при Discovery-идее
  в `implementation` и двух дочерних Delivery-тикетах (`done` и `review`) идея остается
  в `implementation`, то есть переход блокируется любым незавершенным дочерним тикетом.


  Что нужно доработать:

  - Ввести явную модель обязательности связанных Delivery-тикетов, начиная с machine-readable
  payload из technical analysis.

  - Сохранять этот признак у созданных Delivery-тикетов или в связи parent-child.

  - Изменить барьер `implementation`, чтобы он ждал только обязательные связанные
  Delivery-тикеты.

  - Добавить приемочные тесты на сценарий с обязательным и необязательным дочерними
  Delivery-тикетами.'
