id: DEL-459BE8
process: delivery
type: rework
title: 'Rework for DEL-F62D4B: Explicit Codex execution profile per stage'
status: done
priority: 110
description: 'Автоматически создано из DEL-F62D4B на стадии Ревью.


  Summary:

  Traceability added, but `prompt_version` does not actually identify the full execution
  contract, so reproducibility is not guaranteed.


  Details:

  Blocking issue: `prompt_version` is computed only from the prompt file body in `src/vibe_orchestrator/config.py:98-102`,
  while the actual prompt sent to Codex is assembled later in `src/vibe_orchestrator/codex.py:119-155`
  by appending the execution-contract wrapper (`Run ID`, ticket metadata, allowed
  outcomes, instructions, etc.). If that wrapper changes in code, two runs can produce
  different effective prompts while keeping the same `prompt_path` and `prompt_version`
  in durable history. That violates the ticket requirement to preserve reproducible
  execution contract metadata. The fix should version the full prompt template/contract
  that is actually executed, not just the prompt markdown file. Evidence: current
  tests pass (`pytest -q`, 34 passed), but there is no coverage for prompt-wrapper
  drift causing unchanged `prompt_version` with changed executed prompt.'
parent: DEL-F62D4B
