id: DEL-EBA038
process: delivery
type: rework
title: 'Rework for DEL-8A4F27: Rework for DEL-1F285E: Реализовать корректирующие тикеты
  и связь Discovery → Delivery'
status: done
priority: 100
description: 'Автоматически создано из DEL-8A4F27 на стадии Ревью.


  Summary:

  Повторный `technical_analysis` больше не блокирует Discovery устаревшими child-тикетами,
  но реализация все еще оставляет удаленные Delivery-тикеты активными в delivery-потоке,
  поэтому декомпозиция не стала авторитативной целиком.


  Details:

  Блокирующее замечание: в [src/vibe_orchestrator/orchestrator.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/orchestrator.py:211)
  устаревшие delivery-тикеты лишь отвязываются через `child.parent = None`, но их
  статус не меняется. Если такой тикет был в `selected_for_session`, он остается обычным
  активным delivery-тикетом и продолжает участвовать в планировании через `select_candidates()`
  (см. [src/vibe_orchestrator/scheduler.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/scheduler.py:17)),
  потому что scheduler не фильтрует бывшие discovery-derived тикеты без `parent`.
  Это означает, что после повторного анализа система все еще может выполнять работу,
  которой больше нет в последней спецификации. Для тикета с формулировкой «повторный
  technical_analysis должен быть авторитативным для набора связанных Delivery-тикетов»
  этого недостаточно: нужно как минимум деактивировать/закрыть такие тикеты или иным
  образом гарантированно исключить их из delivery workflow, а не только из `children_of()`.


  Доказательство по тестам: добавленный сценарий [tests/test_orchestrator.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/tests/test_orchestrator.py:555)
  проверяет только то, что Discovery `implementation` перестает ждать `B`, и что `stale_child.parent
  is None`. Он не проверяет, что `B` больше не может быть выбран в delivery-процесс.
  Поэтому регрессия остается незамеченной.


  Что нужно доработать перед продолжением процесса:

  1. Сделать удаленные из новой `delivery_tickets` дочерние delivery-тикеты неактивными
  для delivery scheduler-а: закрыть, архивировать, перевести в отдельный terminal/non-pullable
  status или эквивалентно исключить из планирования на уровне модели данных.

  2. Добавить приемочный тест на это поведение: после второго `technical_analysis`
  исчезнувший тикет не только отвязан, но и больше не попадает в кандидаты delivery
  workflow.'
