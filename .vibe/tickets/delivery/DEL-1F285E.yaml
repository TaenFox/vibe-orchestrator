id: DEL-1F285E
process: delivery
type: task
title: Реализовать корректирующие тикеты и связь Discovery → Delivery
status: done
priority: 100
description: 'Доработать оркестратор так, чтобы результаты проверки и анализа реально
  управляли процессом. Для этапов Review и Acceptance добавить отдельный outcome,
  означающий необходимость доработки. При таком результате родительский Delivery-тикет
  должен оставаться на текущем этапе, а оркестратор должен автоматически создавать
  дочерний тикет типа Rework, связанный с родителем. Rework не должен учитывать WIP-лимит
  и должен иметь приоритет над обычными задачами. После завершения всех связанных
  Rework родительский тикет должен снова стать доступен для повторного прохождения
  текущего этапа.


  Для Discovery реализовать аналогичную механику через тикеты типа Correction для
  этапов, где результат требует исправлений.


  Также реализовать связь Discovery → Delivery: результат этапа Technical Analysis
  должен позволять сформировать и автоматически создать связанные Delivery-тикеты
  Story/Task/Bug. Discovery Idea на этапе Implementation должна ожидать завершения
  обязательных связанных Delivery-тикетов и переходить дальше только после их завершения.


  Не менять согласованную модель WIP: родительский тикет при найденной проблеме продолжает
  занимать WIP текущего этапа, а Rework/Correction являются WIP-exempt. Добавить необходимые
  тесты и обновить документацию.'
parent: null
blocked_by: []
wip_exempt: false
