id: DEL-4A1CA7
process: delivery
type: rework
title: 'Rework for DEL-F62D4B: Explicit Codex execution profile per stage'
status: done
priority: 110
description: 'Автоматически создано из DEL-F62D4B на стадии Ревью.


  Summary:

  Нужна доработка execution-contract traceability: `prompt_version` сейчас нельзя
  надежно воспроизвести или проверить по сохраненным артефактам запуска.


  Details:

  Блокирующее замечание:

  1. `prompt_version` считается не от того prompt, который реально сохраняется и исполняется.
  В [src/vibe_orchestrator/codex.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/codex.py:154)
  `_prompt_contract_version()` хеширует шаблон с литералом `"{prompt_version}"`, а
  в [src/vibe_orchestrator/codex.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/codex.py:101)
  и [src/vibe_orchestrator/codex.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/codex.py:121)
  в `prompt.txt`/`run.json` сохраняется уже другой текст, где подставлено финальное
  значение `sha256:...`. В результате аудитор не может пересчитать `prompt_version`
  из persisted artifacts, хотя README/ARCHITECTURE декларируют, что это версия реально
  исполняемого prompt-контракта. Для тикета про воспроизводимость execution contract
  это критично: либо нужно изменить алгоритм так, чтобы версия была верифицируема
  по сохраненному артефакту, либо явно зафиксировать и сериализовать каноническую
  форму prompt, от которой считается хеш.


  Дополнительный риск:

  2. Инвариант "explicit per-stage execution profile" не зафиксирован кодом. Поля
  `Stage.model`/`Stage.reasoning_effort` остаются опциональными в [src/vibe_orchestrator/config.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/config.py:25),
  а `CodexRunner.execution_profile()` молча берет fallback из env в [src/vibe_orchestrator/codex.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/codex.py:68).
  Это оставляет silent regression path: новый agent stage можно добавить без явного
  profile, и acceptance-критерий снова нарушится без падения тестов. Стоит либо валидировать
  это в `load_workflow()`, либо добавить тест/guard на обязательность этих полей для
  `kind: agent`.


  Проверка:

  - Запущено: `pytest -q tests/test_codex.py tests/test_orchestrator.py tests/test_store.py`

  - Результат: `29 passed`


  Несмотря на зеленые тесты, текущее расхождение между вычислением `prompt_version`
  и сохраненным prompt делает реализацию недостаточно надежной для traceability/reproducibility.'
