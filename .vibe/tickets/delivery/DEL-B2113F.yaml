description: 'Автоматически создано из DEL-F294E0 на стадии Ревью.


  Summary:

  Нужна доработка тестового контура для нового immutable execution contract: текущая
  реализация оркестратора выглядит по сути правильной, но обязательные регрессионные
  тесты на traceability сейчас не проходят и не подтверждают тикет.


  Details:

  Блокирующее замечание: после перевода оркестратора на `ExecutionContract` тестовые
  double-раннеры не были адаптированы под новый контрактный API. В [src/vibe_orchestrator/orchestrator.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/orchestrator.py:54),
  [src/vibe_orchestrator/orchestrator.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/orchestrator.py:75),
  [src/vibe_orchestrator/orchestrator.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/orchestrator.py:111)
  и [src/vibe_orchestrator/orchestrator.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/orchestrator.py:255)
  код теперь опирается на `runner.prepare_execution_contract(...)`, но fake-раннеры
  в [tests/test_orchestrator.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/tests/test_orchestrator.py:9)
  и ниже по файлу реализуют только старые методы `execution_profile`/`prompt_spec`/`run`.
  В результате падают 6 тестов (`AttributeError: ''...Runner'' object has no attribute
  ''prepare_execution_contract''`), включая ключевые сценарии для `started/completed/failed`
  и drift-coverage: `test_schedule_records_started_and_completed_run_history`, `test_execute_records_failed_run_history`,
  `test_schedule_preserves_last_terminal_outcome_until_run_finishes`, `test_execute_records_failed_run_history_when_prompt_metadata_breaks`,
  `test_completed_run_history_reuses_started_metadata_when_stage_definition_drifts`,
  `test_failed_run_history_reuses_started_metadata_when_stage_definition_drifts`.
  Проверка: `pytest -q tests/test_orchestrator.py tests/test_codex.py tests/test_store.py`
  завершается с 6 failures. Пока эти тесты не обновлены и не зелёные, нельзя считать
  rework подтвержденным: требуемая регрессия на durable traceability формально не
  зафиксирована проходящим набором тестов.'
