title: 'Rework for DEL-1F285E: Реализовать корректирующие тикеты и связь Discovery
  → Delivery'
status: done
priority: 100
description: 'Автоматически создано из DEL-1F285E на стадии Приемка.


  Summary:

  Повторный `technical_analysis` не синхронизирует уже созданные связанные Delivery-тикеты
  с новым результатом. Перед повторной приемкой нужно привести набор дочерних тикетов
  к актуальной спецификации из последнего анализа.


  Details:

  Расхождение: в [src/vibe_orchestrator/orchestrator.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/orchestrator.py:178)
  `_create_delivery_children()` только создает новые тикеты и обновляет совпавшие
  по `(type, title)`, но никогда не удаляет и не деактивирует ранее созданные Delivery-тикеты,
  которых больше нет в новом `delivery_tickets`.


  Почему это ломает приемку: по тикету Discovery -> Delivery должна реально управлять
  процессом. Если после `needs_correction` технический анализ пересобрал декомпозицию,
  старые обязательные дочерние тикеты остаются привязанными к Discovery-идее. Затем
  [src/vibe_orchestrator/orchestrator.py](/Users/pmokeev/Desktop/Projects/vibe-orchestrator/src/vibe_orchestrator/orchestrator.py:254)
  `_reconcile_discovery_implementation()` продолжает ждать завершения этих устаревших
  `mandatory`-тикетов, и идея не отражает актуальный результат последнего Technical
  Analysis.


  Точечная проверка: выполнил сценарий вручную в временном каталоге. Первый `technical_analysis`
  создал `story A` и `task B`, второй повторный `technical_analysis` вернул только
  `story A`, но `task B` остался связанным дочерним тикетом: `[("story", "A", True,
  "selected_for_session"), ("task", "B", True, "selected_for_session")]`.


  Тесты: `pytest -q tests/test_orchestrator.py tests/test_scheduler.py tests/test_store.py
  tests/test_config.py tests/test_codex.py tests/test_localization.py` -> `42 passed`.
  Но покрытие не ловит описанный сценарий: есть тест на переиспользование существующих
  тикетов, нет теста на удаление/деактивацию тикетов, исчезнувших из нового `delivery_tickets`.


  Что доработать:

  - Сделать повторный `technical_analysis` авторитативным для набора связанных Delivery-тикетов:
  как минимум убрать из блокирующего набора тикеты, которых больше нет в новой спецификации.

  - Добавить приемочный тест на сценарий: `completed` создал A+B, затем повторный
  `completed` после correction оставил только A, и Discovery `implementation` больше
  не ждет B.'
