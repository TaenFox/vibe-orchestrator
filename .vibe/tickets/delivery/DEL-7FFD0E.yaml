id: DEL-7FFD0E
process: delivery
type: rework
title: 'Rework for DEL-459BE8: Rework for DEL-F62D4B: Explicit Codex execution profile
  per stage'
status: done
priority: 110
description: 'Автоматически создано из DEL-459BE8 на стадии Ревью.


  Summary:

  Traceability improved, but durable metadata still does not fully identify the executed
  prompt instance when ticket fields change after a run.


  Details:

  Blocking issue: the executed prompt still embeds mutable ticket data that is not
  snapshotted per run. `CodexRunner._build_prompt()` injects `title`, `priority`,
  `parent`, and `description` into the final prompt (`src/vibe_orchestrator/codex.py:120-142`,
  rendered at `:186-212`), but `ExecutionContract.history_metadata()` persists only
  `prompt_path`, `prompt_version`, `model`, and `reasoning_effort` (`src/vibe_orchestrator/codex.py:25-39`).
  `Orchestrator` writes only that reduced metadata into durable `ticket.run_history`
  (`src/vibe_orchestrator/orchestrator.py:57-65`, `:126-135`). Meanwhile the repo
  documentation explicitly says `.vibe/tickets/**` is the durable audit state and
  `.vibe/runs/<run_id>/` is only local artifacts (`README.md:141-155`). Result: if
  a ticket title/description/priority/parent is edited after a run, the durable history
  no longer contains enough data to reconstruct the actual prompt that was executed,
  even though `prompt_version` now tracks wrapper drift. Tests pass (`pytest -q`,
  35 passed), but coverage only checks wrapper drift (`tests/test_codex.py:41-58`)
  and does not cover prompt reproducibility across later ticket-field edits. Rework
  should either snapshot the prompt inputs used at execution time into durable history,
  or explicitly redefine the traceability contract so reproducibility does not rely
  on mutable ticket fields.'
