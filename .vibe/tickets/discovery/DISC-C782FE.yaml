id: DISC-C782FE
process: discovery
type: correction
title: 'Correction for DISC-879090: Improve agent execution traceability'
status: done
priority: 100
description: 'Автоматически создано из DISC-879090 на стадии Валидация.


  Summary:

  Гипотеза по traceability не подтверждена: в текущем состоянии репозитория durable
  history/handoffs и явный execution profile для Codex не реализованы. Изменения в
  ветке в основном про Rework/Correction и Discovery→Delivery, а не про воспроизводимость
  и аудит запусков; нужен correction с возвратом к исходному scope.


  Details:

  Что изменилось относительно гипотезы: в рабочем дереве добавлена автоматизация `needs_rework`/`needs_correction`,
  блокировки родителя и создание Delivery-тикетов из Discovery (`src/vibe_orchestrator/orchestrator.py`,
  `workflows/discovery.yaml`, `workflows/delivery.yaml`, `README.md`, `ARCHITECTURE.md`).
  Это полезно для workflow, но не закрывает исходную идею `Improve agent execution
  traceability`.


  Почему гипотеза не подтверждается:

  - В модели тикета по-прежнему нет durable append-only истории запусков/hand-offs:
  `Ticket` хранит только `active_run`, `last_outcome`, `last_summary` в `src/vibe_orchestrator/tickets.py:19-36`.

  - При завершении запуска оркестратор все еще просто перезаписывает `last_outcome`
  и `last_summary` в `src/vibe_orchestrator/orchestrator.py:71-81`; предыдущие summaries
  в ticket state не сохраняются.

  - Подробные артефакты запуска остаются только в локальных `.vibe/runs/<run_id>/result.json`
  и `events.jsonl` через `src/vibe_orchestrator/codex.py:30-43`; `TicketStore.init()`
  специально игнорирует `runs/` через `.vibe/.gitignore`, то есть это не durable/shareable
  audit trail.

  - `run_id` не сквозной: оркестратор пишет один UUID в `ticket.active_run` (`src/vibe_orchestrator/orchestrator.py:45-51`),
  а `CodexRunner.run()` создает другой UUID для каталога `.vibe/runs` (`src/vibe_orchestrator/codex.py:31`),
  что ухудшает traceability.

  - Workflow schema не содержит явных полей модели и reasoning effort: `Stage` в `src/vibe_orchestrator/config.py:10-18`
  умеет только `id/title/kind/wip/pull_to/prompt/outcomes/next`; в `workflows/*.yaml`
  таких настроек нет.

  - `codex exec` все еще вызывается без явной модели и reasoning effort в `src/vibe_orchestrator/codex.py:37`;
  prompt identifier/version тоже не вычисляется и не сохраняется.

  - README все еще описывает старую форму запуска `codex exec` без explicit model/reasoning
  profile и без durable run-history контракта (`README.md:44`).


  Производственные свидетельства и проверки:

  - Текущий тикет `.vibe/tickets/discovery/DISC-879090.yaml` все еще содержит только
  `last_summary`, а не историю запусков.

  - В `.vibe/runs/*/result.json` есть локальные результаты прошлых прогонов, но они
  не связаны durable-ссылкой из тикета и не коммитятся.

  - Запуск `pytest -q tests/test_orchestrator.py tests/test_scheduler.py tests/test_store.py`
  на 2026-08-16 завершился с ошибкой: `1 failed, 11 passed`.

  - Полный `pytest -q` тоже падает: `1 failed, 15 passed`.

  - Падение в `tests/test_orchestrator.py:92` связано с недетерминированным порядком
  дочерних Delivery-тикетов; это дополнительный сигнал, что текущая итерация даже
  в своем фактическом scope не полностью стабилизирована.


  Оценка гипотезы: не подтверждается.

  Уровень уверенности: высокий.

  Оговорки: я валидировал по состоянию репозитория и локальным артефактам; внешних
  продуктовых метрик/feedback по traceability в репозитории не найдено. Отсутствие
  evidence здесь связано прежде всего с отсутствием самой реализации.


  Рекомендуемое следующее действие: открыть Correction и вернуть работу к исходному
  scope тикета. Минимум для следующего цикла: 1) добавить committed durable run history/handoffs,
  сохранив `last_summary` как projection; 2) сделать единый `run_id` end-to-end; 3)
  расширить workflow/config явными `model` и `reasoning_effort`; 4) передавать их
  в `codex exec`; 5) сохранять prompt identifier/version, outcome, summary и ссылки
  на артефакты; 6) обновить README/ARCHITECTURE и добавить тесты на историю/metadata/replayability.'
