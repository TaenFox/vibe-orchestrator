id: DISC-879090
process: discovery
type: idea
title: Improve agent execution traceability
status: done
priority: 100
description: Improve the orchestrator so that agent runs are reproducible and auditable.
  Add durable ticket history/handoffs instead of overwriting only last_summary; keep
  last_summary as a convenience field. Record per-run metadata including model, reasoning
  effort, prompt identifier/version, outcome and summary. Make Codex model and reasoning
  effort explicit in workflow configuration and pass them to codex exec. Update README/documentation
  accordingly.
