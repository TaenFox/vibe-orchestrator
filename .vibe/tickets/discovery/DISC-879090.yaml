last_summary: 'Current architecture is close to supporting auditability, but today
  each run only overwrites `last_summary`/`last_outcome` on the ticket and stores
  unlinked local artifacts under `.vibe/runs/`; model and reasoning effort are implicit
  in the operator’s Codex config. Smallest coherent approach: make agent-stage execution
  settings explicit in workflow YAML, use one durable `run_id` end-to-end, append
  immutable run-history entries to ticket YAML while keeping `last_summary` as a convenience
  mirror, and write a per-run manifest beside existing run artifacts. No new external
  dependencies are required; cost is moderate and contained to config parsing, runner/orchestrator
  plumbing, ticket schema evolution, tests, and docs.'
